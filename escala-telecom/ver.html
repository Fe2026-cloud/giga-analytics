<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Minha escala · GIGA+</title>
<script src="config.js"></script>
<style>
  :root{--bg:#05070d;--surface:#0e1426;--surface2:#151c33;--border:#222c4a;--text:#eef2ff;--text2:#9fb0d6;--navy:#1B3A8F;--ice:#A9C1FF;
    --t1:#7DB7FF;--t1fg:#04132e;--t2:#16296B;--t2fg:#fff;--sa:#E4E8EE;--safg:#0b1530;--f:#1a2133;--ffg:#8fa0c8;--fe:#17694a;--fefg:#d9ffe9;--hoje:#1B3A8F}
  @media (prefers-color-scheme:light){:root{--bg:#f3f5fb;--surface:#fff;--surface2:#eef2fa;--border:#d6ddf0;--text:#0b1530;--text2:#4a5a82;--sa:#334155;--safg:#fff;--f:#e3e8f5;--ffg:#4a5a82}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  .top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}.logo{font-weight:800;font-size:22px;letter-spacing:.02em}.logo b{color:var(--ice)}
  .sub{font-size:12px;color:var(--text2)}
  h1{font-size:22px;margin:0 0 2px}.area{font-size:13px;color:var(--text2);margin-bottom:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
  .hoje{background:var(--navy);border-color:var(--ice);color:#fff}.hoje .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
  .hoje .big{font-size:30px;font-weight:800;margin:4px 0}.hoje .hr{font-size:15px;opacity:.95}
  .chip{display:inline-block;border-radius:10px;padding:3px 10px;font-weight:700;font-size:13px}
  .T1{background:var(--t1);color:var(--t1fg)}.T2{background:var(--t2);color:var(--t2fg)}.SA{background:var(--sa);color:var(--safg)}.F{background:var(--f);color:var(--ffg)}.FE{background:var(--fe);color:var(--fefg)}.AF{background:#5a2a2a;color:#ffd9d9}
  .sem{display:grid;gap:6px}.dia{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface2)}
  .dia.hoje2{outline:2px solid var(--ice)}.dia .d{width:62px;font-size:13px;font-weight:700}.dia .d small{display:block;font-weight:500;color:var(--text2)}.dia .t{flex:1;font-size:13px}
  .mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.mes button{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;width:40px;height:36px;font-size:18px}
  .mes b{font-size:16px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{font-size:11px;color:var(--text2);text-align:center;padding-bottom:2px}
  .cal .c{aspect-ratio:1/1.05;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;position:relative}
  .cal .c i{font-style:normal;font-size:10px;font-weight:600;opacity:.85}.cal .c.vz{background:transparent}.cal .c.hj{outline:2px solid var(--ice)}.cal .c .n{position:absolute;top:2px;left:4px;font-size:9px;font-weight:600;opacity:.8}
  .leg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:11px}.cont a{color:var(--ice);text-decoration:none;font-weight:600}.cont div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
  .cont div:last-child{border:0}.cont small{display:block;color:var(--text2);font-size:11px}
  .plant{font-size:14px}.plant b{color:var(--ice)}
  .erro{text-align:center;padding:60px 10px;color:var(--text2)}.erro h1{color:var(--text)}
</style>
</head>
<body>
<main id="app"><div class="erro">Carregando…</div></main>
<script>
(function(){
'use strict';
const CFG=window.ESCALA_CONFIG||{};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],WDL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const tmin=s=>{const [h,m]=(s||'0:0').split(':').map(Number);return h*60+(m||0)};
const hm=min=>`${pad(Math.floor(min/60)%24)}:${pad(min%60)}`;
const token=new URLSearchParams(location.search).get('t')||'';
let D=null,view=null;

async function carrega(){
  if(!token){return erro('Link incompleto','Peça o seu link pessoal ao seu gestor.')}
  try{
    const r=await fetch(CFG.url+'/rest/v1/rpc/esc_ver_tecnico',{method:'POST',headers:{'apikey':CFG.chave,'Authorization':'Bearer '+CFG.chave,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});
    if(!r.ok)throw new Error('http '+r.status);
    D=await r.json();
  }catch(e){return erro('Sem conexão','Não foi possível carregar agora. Tente de novo em instantes.')}
  if(!D)return erro('Link inválido ou desativado','Peça um novo link ao seu gestor.');
  const hoje=new Date();const ini=D.inicio?parse(D.inicio):hoje;
  view={y:(hoje<ini?ini:hoje).getFullYear(),m:(hoje<ini?ini:hoje).getMonth()};
  desenha();
}
function erro(t,s){$('#app').innerHTML=`<div class="erro"><h1>${esc(t)}</h1><p>${esc(s)}</p></div>`}
const turno=id=>(D.turnos||[]).find(t=>t.id===id);
function fimTurno(t){return hm(tmin(t.ini)+tmin(D.jornada)+tmin(D.intervalo))}
function info(ds){
  const c=D.dias&&D.dias[ds];if(!c)return null;
  const t=turno(c.t);
  if(t)return {cls:c.sa?'SA':c.t.includes('2')||t===(D.turnos||[])[1]?'T2':'T1',cod:c.t,sa:c.sa,rot:t.nome,hr:`${t.ini}–${fimTurno(t)}`,trab:true,t};
  const m={F:'Folga',FE:'Férias',AF:'Afastado'};return {cls:c.t==='FE'?'FE':c.t==='AF'?'AF':'F',cod:c.t,rot:m[c.t]||c.t,hr:'',trab:false};
}
function clsTurno(c){const t=turno(c.t);return t&&t===(D.turnos||[])[1]?'T2':'T1'}
function celula(ds){
  const c=D.dias&&D.dias[ds];if(!c)return null;const t=turno(c.t);
  if(t){const k=clsTurno(c);return {cls:c.sa?'SA':k,k,sa:c.sa,rot:t.nome,hr:`${t.ini}–${fimTurno(t)}`,trab:true,cod:k==='T2'?'T2':'T1'}}
  const m={F:'Folga',FE:'Férias',AF:'Afastado'};return {cls:c.t,rot:m[c.t]||c.t,hr:'',trab:false,cod:c.t}
}
function plantonista(d){
  const L=D.plantonistas;if(!Array.isArray(L)||!L.length)return null;
  const seg=addD(d,-((d.getDay()+6)%7)),W=Math.round((seg-new Date(2025,11,29))/(7*864e5))+1;
  return {nome:L[(((W-51)%L.length)+L.length)%L.length],W,de:seg,ate:addD(seg,6)};
}
const tel=(n,t)=>t?`<a href="tel:${esc(t.replace(/[^\d+]/g,''))}">${esc(t)}</a>`:'';
function desenha(){
  const hoje=new Date(),hs=iso(hoje),ini=D.inicio?parse(D.inicio):null,antes=ini&&hoje<ini;
  const ref=antes?ini:hoje,rs=iso(ref),c0=celula(rs);
  let h=`<div class="top"><div class="logo">GIGA<b>+</b></div><div class="sub">Minha escala</div></div><h1>${esc(D.nome)}</h1><div class="area">${esc(D.area||'')}${D.grupo?' · '+esc(D.grupo):''}</div>`;
  h+=`<div class="card hoje"><div class="lbl">${antes?'A escala começa em '+rs.slice(8)+'/'+rs.slice(5,7):'Hoje · '+WDL[hoje.getDay()]+', '+pad(hoje.getDate())+'/'+pad(hoje.getMonth()+1)}</div>`;
  if(c0){h+=`<div class="big">${c0.trab?(c0.sa?'Sobreaviso':c0.rot):c0.rot}</div><div class="hr">${c0.trab?(c0.hr+(c0.sa?' · sobreaviso 19:24–23:59 e 00:01–06:00':'')):''}</div>`}else h+=`<div class="big">—</div>`;
  const pl=plantonista(ref);if(pl)h+=`<div class="hr" style="margin-top:8px">Plantonista da semana (W${pl.W}): <b>${esc(pl.nome)}</b></div>`;
  h+=`</div>`;
  // próximos 7 dias
  h+=`<div class="card"><div class="sub" style="margin-bottom:8px">Próximos 7 dias</div><div class="sem">`;
  for(let i=0;i<7;i++){const d=addD(ref,i),ds=iso(d),c=celula(ds);
    h+=`<div class="dia ${ds===hs?'hoje2':''}"><div class="d">${WD[d.getDay()]}<small>${pad(d.getDate())}/${pad(d.getMonth()+1)}</small></div><div class="t">${c?`<span class="chip ${c.cls}">${c.trab?(c.sa?'SA · ':'')+c.cod:c.rot}</span> ${c.trab?esc(c.hr):''}`:'<span style="color:var(--text2)">sem escala</span>'}</div></div>`}
  h+=`</div></div>`;
  // mês
  const y=view.y,m=view.m,pri=new Date(y,m,1),nd=new Date(y,m+1,0).getDate();
  h+=`<div class="card"><div class="mes"><button id="ant" aria-label="Mês anterior">‹</button><b>${MES[m]} ${y}</b><button id="prx" aria-label="Próximo mês">›</button></div><div class="cal">${WD.map(w=>`<div class="h">${w}</div>`).join('')}`;
  for(let i=0;i<pri.getDay();i++)h+=`<div class="c vz"></div>`;
  for(let d=1;d<=nd;d++){const ds=`${y}-${pad(m+1)}-${pad(d)}`,c=celula(ds);
    h+=c?`<div class="c ${c.cls} ${ds===hs?'hj':''}"><span class="n">${d}</span>${c.trab?(c.sa?'SA':c.cod):c.cod}<i>${c.trab?c.hr.slice(0,5):''}</i></div>`:`<div class="c ${ds===hs?'hj':''}" style="background:var(--surface2);color:var(--text2)"><span class="n">${d}</span>·</div>`}
  h+=`</div><div class="leg"><span class="chip T1">T1</span><span class="chip T2">T2</span><span class="chip SA">SA sobreaviso</span><span class="chip F">F folga</span><span class="chip FE">FE férias</span></div></div>`;
  // contatos
  const cs=[['GA',D.ga,D.tel_ga],['GO',D.go,D.tel_go],['GG',D.gg,D.tel_gg]].filter(x=>x[1]);
  if(cs.length)h+=`<div class="card cont"><div class="sub" style="margin-bottom:6px">Contatos</div>${cs.map(x=>`<div><span>${esc(x[1])}<small>${x[0]}</small></span><span>${tel(x[1],x[2])}</span></div>`).join('')}</div>`;
  h+=`<div class="sub" style="text-align:center">Esta página mostra somente a sua escala.</div>`;
  $('#app').innerHTML=h;
  $('#ant').onclick=()=>{view.m--;if(view.m<0){view.m=11;view.y--}desenha()};
  $('#prx').onclick=()=>{view.m++;if(view.m>11){view.m=0;view.y++}desenha()};
}
carrega();
})();
</script>
</body>
</html>
